# ── Server ──────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── DataSource ───────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finance_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ── JPA / Hibernate ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:ZmluYW5jZS10cmFja2VyLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC0yMDI0LW1pbi01MTItYml0cw==}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ── Mail (Gmail SMTP) ─────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:prv784@gmail.com}
